<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>탭체크 TapCheck</title>
<meta name="description" content="해외 도시별 교통카드, 신용카드 탭 결제, 설치할 앱, 공항에서 시내 가는 법을 한눈에.">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="탭체크">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
.disclaim{margin:0;font-size:12px;color:#cbd5e1}
footer a{color:var(--muted)}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap">
<style>
/* Layout: 지하철 노선도 감성 — 도시마다 고유 노선색 배지, 상세는 노선색 헤더 위에 승차권 모양 판정 카드 */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e3e7ee; --band:#111827; --band-ink:#ffffff;
  --accent:#2f5bff;
  --yes:#0f9d63; --yes-bg:#e3f6ec; --part:#c27803; --part-bg:#fdf1d8; --no:#dc3b30; --no-bg:#fde6e4;
  --head:"Outfit","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(17,24,39,.06),0 6px 18px rgba(17,24,39,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0f17; --surface:#151b26; --ink:#eef2f8; --muted:#9aa4b5; --line:#242c3a; --band:#1b2333; --band-ink:#ffffff;
  --accent:#7b9bff;
  --yes:#4fd896; --yes-bg:#123526; --part:#f5b94a; --part-bg:#3a2b10; --no:#ff7d73; --no-bg:#3d1916;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f17; --surface:#151b26; --ink:#eef2f8; --muted:#9aa4b5; --line:#242c3a; --band:#1b2333; --band-ink:#ffffff;
  --accent:#7b9bff;
  --yes:#4fd896; --yes-bg:#123526; --part:#f5b94a; --part-bg:#3a2b10; --no:#ff7d73; --no-bg:#3d1916;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 목록 헤더 */
.top{background:var(--band);color:var(--band-ink);padding-block:22px 26px;border-radius:0 0 28px 28px}
.top .wrap{display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:#2f5bff;display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.brand h1{font-family:var(--head);font-weight:800;font-size:24px;margin:0;letter-spacing:-.3px}
.lead{font-size:22px;font-weight:900;line-height:1.3;margin:0;text-wrap:balance;letter-spacing:-.4px}
.lead span{color:#8fa8ff}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:.6}
#q{width:100%;font:inherit;padding:13px 14px 13px 42px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff}
#q::placeholder{color:rgba(255,255,255,.6)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:18px 4px;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px;padding-top:10px}
.city{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.city:hover{transform:translateY(-2px)}
.badge{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800;font-size:20px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.25)}
.city .t{min-width:0;display:grid}
.city .nm{font-weight:900;font-size:17px;letter-spacing:-.3px}
.city .en{font-family:var(--head);font-weight:500;color:var(--muted);font-size:13px}
.ind{display:flex;gap:6px}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.dot svg{width:18px;height:18px}
.legend{display:flex;gap:14px;justify-content:center;color:var(--muted);font-size:12px;padding-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.yes{color:var(--yes);background:var(--yes-bg)} .part{color:var(--part);background:var(--part-bg)} .no{color:var(--no);background:var(--no-bg)}
.empty{color:var(--muted);text-align:center;padding:30px 0}

/* 상세 */
.hero{color:#fff;padding-block:18px 70px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(255,255,255,.12)}
.hero .wrap{display:grid;gap:4px;position:relative;z-index:1}
.back{all:unset;cursor:pointer;font-weight:700;font-size:14px;opacity:.9;margin-bottom:14px;width:max-content}
.hero .ctry{font-size:13px;font-weight:700;opacity:.85}
.hero h2{font-size:44px;font-weight:900;margin:0;line-height:1.05;letter-spacing:-1px}
.hero .en{font-family:var(--head);font-weight:700;font-size:16px;opacity:.85}
.hero .op{font-size:13px;opacity:.8;margin-top:6px}
.ticket{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-top:-48px;position:relative;z-index:2}
.tk{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:18px;align-items:start}
.tk+.tk{border-top:2px dashed var(--line)}
.big{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;grid-row:1/4}
.big svg{width:26px;height:26px}
.tk .q{font-size:12px;font-weight:700;color:var(--muted)}
.tk .a{font-size:22px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.tk .d{font-size:14px;color:var(--muted)}
.sec{display:grid;gap:10px;padding-top:24px}
.sec h3{margin:0;font-size:17px;font-weight:900;letter-spacing:-.3px}
.steps{list-style:none;margin:0;padding:0;display:grid}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:attr(data-n);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--head);font-weight:800;font-size:14px;z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;left:12px;top:28px;bottom:0;width:4px;background:var(--c);opacity:.35;border-radius:2px}
.steps li span{padding-top:3px}
.info{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:6px}
.info .lab{font-size:12px;font-weight:700;color:var(--muted)}
.info .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.info .n{font-weight:900;font-size:16px}
.price{font-family:var(--head);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:999px;background:var(--bg)}
.info .d{font-size:14px;color:var(--muted)}
.tip{border-radius:18px;padding:16px;display:grid;gap:4px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tip b{font-size:13px;color:var(--c)}
.meta{font-size:12px;color:var(--muted);display:grid;gap:4px;padding-top:22px}
.meta a{color:var(--muted)}
footer{font-size:12px;color:var(--muted);text-align:center;padding-top:28px}
@media (prefers-reduced-motion:reduce){.city{transition:none}}
</style>
<style>
.city{position:relative}
.fav{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.fav svg{width:22px;height:22px}
.fav[aria-pressed="true"]{color:#f5a524}
.fav[aria-pressed="true"] svg{fill:currentColor}
.hero .fav{position:absolute;right:0;top:0;color:#fff;background:rgba(255,255,255,.15)}
.hero .fav[aria-pressed="true"]{color:#ffd166}
.cardwrap{display:flex;align-items:center;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding-right:6px;transition:transform .15s}
.cardwrap:hover{transform:translateY(-2px)}
.cardwrap .city{flex:1;min-width:0;background:none;box-shadow:none;padding-right:6px}
.cardwrap .city:hover{transform:none}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.form{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.form label{font-size:12px;font-weight:700;color:var(--muted)}
.form select,.form textarea{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form textarea{min-height:84px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.subtabs .chipbtn{white-space:nowrap;background:var(--surface)}
.subtabs .chipbtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.chipbtn[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff;border-color:transparent}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tips{display:grid;gap:8px}
.tipitem{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:grid;gap:4px}
.tipitem .who{font-size:12px;font-weight:700;color:var(--muted)}
.tipitem p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.inbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:10px;margin-top:14px}
.inbox h3{margin:0;font-size:15px;font-weight:900}
.inbox .r{border-top:1px solid var(--line);padding-top:10px;font-size:14px;display:grid;gap:2px}
.inbox .r b{font-size:12px;color:var(--accent)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{font-size:13px;color:var(--muted);font-weight:700;margin:4px 0 0}
</style>
<style>
.appbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.appverdict{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px 16px}
.appverdict svg{width:26px;height:26px}
.appverdict div{display:grid;gap:2px;color:var(--ink)}
.appverdict b{font-size:18px;font-weight:900;letter-spacing:-.3px}
.appverdict span{font-size:13px;color:var(--muted)}
.appbox.no .appverdict{background:var(--no-bg);color:var(--no)} .appbox.part .appverdict{background:var(--part-bg);color:var(--part)} .appbox.yes .appverdict{background:var(--yes-bg);color:var(--yes)}
.appbox.no .appverdict b{color:var(--no)} .appbox.part .appverdict b{color:var(--part)} .appbox.yes .appverdict b{color:var(--yes)}
.approw{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:16px;border-top:1px solid var(--line)}
.appicon{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:-.3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 2px 6px rgba(0,0,0,.15)}
.appinfo{display:grid;gap:3px;min-width:0}
.appname{font-weight:900;font-size:16px}
.appby{font-size:12px;color:var(--muted);font-weight:700}
.appfor{font-size:14px}
.os{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.os i{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.os .ok{background:var(--yes-bg);color:var(--yes)} .os .x{background:var(--bg);color:var(--muted)}
.stores{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stores a{font-size:13px;font-weight:700;color:var(--bg);background:var(--ink);padding:8px 14px;border-radius:10px;text-decoration:none}
</style>
<style>
.airbox{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.airhead{padding:12px 16px;font-weight:900;font-size:14px;background:color-mix(in srgb,var(--c) 12%,var(--surface));color:var(--ink)}
.airrow{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:4px}
.airtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.airname{font-weight:900;font-size:15px;min-width:0}
.airdesc{font-size:14px;color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.airtip{padding:12px 16px;border-top:1px solid var(--line);font-size:13px;font-weight:700}
.airsrc{padding:0 16px 14px;font-size:12px;color:var(--muted)}
.airsrc a{color:var(--muted)}
</style>
<style>
.seg{display:flex;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow);margin-top:16px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:900;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.railintro{color:var(--muted);font-size:14px;margin:14px 0 0}
.railcard{background:var(--surface);box-shadow:var(--shadow)}
.railcard .badge{font-size:15px}
.arrow{font-size:26px;color:var(--muted);font-weight:300;padding-right:4px}
.blist{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.ticket .appbox{border-radius:20px}
</style>
<style>
/* 단색 정리: 반투명·파스텔·흐린 그림자 제거, 역 표지판처럼 또렷한 단색 */
:root{--part:#b45309;--on:#ffffff;--sign:#facc15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--on:#0b0f17}}
:root[data-theme="dark"]{--on:#0b0f17}
.city,.cardwrap,.info,.ticket,.appbox,.airbox,.form,.tipitem,.inbox,.seg,.railcard,.tip{box-shadow:0 0 0 1px var(--line)}
.cardwrap .city{box-shadow:none}
.cardwrap:hover,.city:hover{transform:none}
.cardwrap:hover,.railcard:hover{box-shadow:0 0 0 2px var(--ink)}
.yes,.no,.part{color:var(--on)}
.yes{background:var(--yes)} .part{background:var(--part)} .no{background:var(--no)}
.appbox.no .appverdict,.appbox.part .appverdict,.appbox.yes .appverdict{background:var(--surface);color:var(--ink);padding:18px 16px}
.appbox.no .appverdict b,.appbox.part .appverdict b,.appbox.yes .appverdict b{color:var(--ink);font-size:19px}
.appverdict span{color:var(--muted);font-size:14px;line-height:1.5}
.appverdict svg{width:40px;height:40px;padding:8px;border-radius:12px;color:var(--on)}
.appbox.no .appverdict svg{background:var(--no)} .appbox.part .appverdict svg{background:var(--part)} .appbox.yes .appverdict svg{background:var(--yes)}
.os .ok{background:none;color:var(--yes);box-shadow:inset 0 0 0 1.5px var(--yes)}
.os .x{background:none;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.hero::after{display:none}
.badge,.appicon{box-shadow:none}
.mark{background:#2f5bff}
.lead span{color:#7b9bff}
#q{background:#ffffff;color:#111827}
#q::placeholder{color:#6b7280}
.search svg{color:#6b7280;opacity:1;z-index:1}
.tip{background:var(--surface)}
.tip b{color:var(--ink)}
.airhead{background:var(--c);color:#fff}
.legend i{border-radius:2px}
</style>
<style>
/* 차분한 상태 표시: 넓은 면은 무채색, 색은 아이콘과 점에만 */
:root{--yes:#1e7a52;--part:#a35d0b;--no:#b4382f;--chipbg:#eef1f6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--yes:#6cc79a;--part:#e0a85a;--no:#ef8a80;--chipbg:#1f2733}}
:root[data-theme="dark"]{--yes:#6cc79a;--part:#e0a85a;--no:#ef8a80;--chipbg:#1f2733}
.yes,.part,.no{background:var(--chipbg)}
.dot.yes,.big.yes,.appbox.yes .appverdict svg{color:var(--yes);background:var(--chipbg)}
.dot.part,.big.part,.appbox.part .appverdict svg{color:var(--part);background:var(--chipbg)}
.dot.no,.big.no,.appbox.no .appverdict svg{color:var(--no);background:var(--chipbg)}
.chip.yes,.chip.part,.chip.no{color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip.yes::before,.chip.part::before,.chip.no::before{content:"";width:8px;height:8px;border-radius:50%;flex:none}
.chip.yes::before{background:var(--yes)} .chip.part::before{background:var(--part)} .chip.no::before{background:var(--no)}
.os .ok{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
</style>
<style>
/* 설치할 앱 결론 줄: 처음 디자인으로 복원 */
:root{--o-yes:#0f9d63;--o-part:#c27803;--o-no:#dc3b30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--o-yes:#4fd896;--o-part:#f5b94a;--o-no:#ff7d73}}
:root[data-theme="dark"]{--o-yes:#4fd896;--o-part:#f5b94a;--o-no:#ff7d73}
.appbox.no .appverdict,.appbox.part .appverdict,.appbox.yes .appverdict{padding:14px 16px}
.appbox.no .appverdict{background:var(--no-bg);color:var(--o-no)}
.appbox.part .appverdict{background:var(--part-bg);color:var(--o-part)}
.appbox.yes .appverdict{background:var(--yes-bg);color:var(--o-yes)}
.appbox.no .appverdict b{color:var(--o-no)} .appbox.part .appverdict b{color:var(--o-part)} .appbox.yes .appverdict b{color:var(--o-yes)}
.appbox .appverdict b{font-size:18px}
.appbox.yes,.appbox.part,.appbox.no{color:var(--ink);background:var(--surface)}
.appbox .appname{color:var(--ink)} .appbox .appfor{color:var(--ink)} .appbox .appby{color:var(--muted)}
.appbox .appverdict span{color:var(--muted);font-size:13px}
.appbox.no .appverdict svg,.appbox.part .appverdict svg,.appbox.yes .appverdict svg{width:26px;height:26px;padding:0;background:none;color:inherit;border-radius:0}

(async()=>{
  const cfg=window.TAPCHECK_CONFIG||{};
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){tipsState="off";rerender();return}
  try{db=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}});myId="anon"}catch(e){tipsState="off";rerender();return}
  const timer=setTimeout(()=>{if(tipsState==="loading"){tipsState="slow";rerender()}},10000);
  try{
    const {data,error}=await db.from("tips").select("id,city,role,text,created_at").order("created_at",{ascending:false}).limit(1000);
    clearTimeout(timer);
    if(error)throw error;
    tips=(data||[]).map(t=>({city:t.city,role:t.role,text:t.text,at:Date.parse(t.created_at),owner:myTipIds.has(t.id)?myId:"x"}));
    tipsState="ready";
  }catch(e){clearTimeout(timer);tipsState="error"}
  rerender();
})();
async function appendMine(col,item){
  if(!db)throw new Error("off");
  let row;
  if(col==="tips")row={city:item.city,role:item.role,text:item.text};
  else if(col==="reports")row={city:item.city,field:item.field,text:item.text};
  else row={city:item.city,note:item.note||""};
  if(col==="tips"){
    const {data,error}=await db.from("tips").insert(row).select("id").single();
    if(error)throw error;
    myTipIds.add(data.id);try{localStorage.setItem("tapcheck-mytips",JSON.stringify([...myTipIds]))}catch(e){}
    tips.unshift({...item,owner:myId});
  }else{
    const {error}=await db.from(col).insert(row);
    if(error)throw error;
  }
}

const NEED={must:{t:"이 앱, 꼭 깔고 가세요",cls:"no"},rec:{t:"깔아두면 편해요",cls:"part"},none:{t:"앱 안 깔아도 돼요",cls:"yes"}};
function appSection(c){
  const a=APPS[c.id];if(!a)return "";
  const n=NEED[a.need];
  return `<section class="sec"><h3>설치할 앱</h3>
  <div class="appbox ${n.cls}"><div class="appverdict">${ICON[n.cls]}<div><b>${n.t}</b><span>${esc(a.say)}</span></div></div>
  ${a.list.map(p=>`<div class="approw">
    <div class="appicon" style="background:${c.color}">${esc(p.ab)}</div>
    <div class="appinfo"><span class="appname">${esc(p.name)}</span><span class="appby">${esc(p.by)}</span><span class="appfor">${esc(p.for)}</span>
      <span class="os"><i class="${p.ios?"ok":"x"}">iPhone ${p.ios?"✓":"✗"}</i><i class="${p.android?"ok":"x"}">Android ${p.android?"✓":"✗"}</i></span>
      ${p.links.length?`<span class="stores">${p.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("")}</span>`:""}
    </div></div>`).join("")}
  </div></section>`;
}

const PAYLAB={yes:"카드 탭 OK",part:"조건부",no:"표 먼저 구매"};
function airSection(c){
  const a=AIR[c.id];if(!a)return "";
  return `<section class="sec"><h3>공항 → 시내</h3>
  <div class="airbox"><div class="airhead">✈ ${esc(a.ap)}</div>
  ${a.opts.map(o=>`<div class="airrow"><div class="airtop"><span class="airname">${esc(o.n)}</span><span class="chip ${o.pay}">${PAYLAB[o.pay]}</span></div><span class="airdesc">${esc(o.d)}</span></div>`).join("")}
  <div class="airtip">${esc(a.tip)}</div>
  <div class="airsrc">${a.src.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")}</div>
  </div></section>`;
}

let mode="city";
function setMode(m){mode=m;view.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  const ca=document.getElementById("cityArea"),ra=document.getElementById("railArea");if(ca)ca.hidden=m!=="city";if(ra)ra.hidden=m!=="rail";}
function renderRailList(){
  const el=document.getElementById("railArea");if(!el)return;
  el.innerHTML=`<p class="railintro">도시와 도시 사이를 기차로 이동할 때 알아야 할 것만 나라별로 모았어요.</p><div class="list">${RAIL.map(r=>`
    <button class="city railcard" data-r="${r.id}"><span class="badge" style="background:${r.color}">${esc(r.apps[0].ab)}</span>
    <span class="t"><span class="nm namerow">${flagImg(r.name,"flagsm")}${esc(r.name)} 기차</span><span class="en">${esc(r.ops)}</span></span><span class="arrow">›</span></button>`).join("")}</div>`;
  el.querySelectorAll(".railcard").forEach(b=>b.addEventListener("click",()=>{location.hash="rail-"+b.dataset.r}));
}
function railView(r){
  cur=null;
  const block=(t,arr)=>`<section class="sec"><h3>${t}</h3><div class="info"><ul class="blist">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>`;
  view.innerHTML=`
  <div class="hero" style="background:${r.color}"><div class="wrap">
    <button class="back" id="back">← 기차 목록</button>
    ${flagImg(r.name,"flaghero")}<span class="ctry">기차</span><h2>${esc(r.name)}</h2><span class="en">${r.en}</span><span class="op">${esc(r.ops)}</span>
  </div></div>
  <div class="wrap" style="--c:${r.color}">
    <div class="ticket"><div class="appbox part" style="box-shadow:none"><div class="appverdict">${ICON.phone}<div><b>이 앱으로 표를 사세요</b><span>${esc(r.ticket)}</span></div></div>
    ${r.apps.map(p=>`<div class="approw"><div class="appicon" style="background:${r.color}">${esc(p.ab)}</div><div class="appinfo"><span class="appname">${esc(p.name)}</span><span class="appby">${esc(p.by)}</span><span class="appfor">${esc(p.for)}</span><span class="stores">${p.links.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join("")}</span></div></div>`).join("")}
    </div></div>
    ${block("타기 전에 꼭 확인",r.before)}
    ${block("싸게 타는 법",r.save)}
    <section class="sec"><div class="tip"><b>여행자가 자주 하는 실수</b><span>${r.mistakes.map(esc).join("<br>")}</span></div></section>
    <div class="meta"><span>마지막 확인 2026년 11월 · 출처</span>${r.src.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div>
  </div>`;
  document.getElementById("back").addEventListener("click",()=>{mode="rail";location.hash=""});
  window.scrollTo(0,0);
}

function listView(){
  view.innerHTML=`
  <div class="top"><div class="wrap">
    <div class="brand"><div class="mark">${ICON.tap}</div><h1>TapCheck</h1></div>
    <p class="lead">도착하기 전에,<br><span>뭘 찍고 타야 하는지</span> 확인하세요</p>
    <p class="disclaim">2026년 11월 기준 정보예요. 교통 정책은 자주 바뀌니 출발 전 공식 사이트도 꼭 확인하세요.</p>
    <div class="search">${ICON.search}<input id="q" type="search" placeholder="도시 검색 (예: 프라하, Milan)" value="${esc(query)}" aria-label="도시 검색"></div>
  </div></div>
  <div class="wrap">
    <div class="seg" role="group" aria-label="보기 선택"><button data-m="city" aria-pressed="true">도시 교통</button><button data-m="rail" aria-pressed="false">기차</button></div>
    <div id="cityArea">
    <div class="tabs" role="group" aria-label="지역 선택">${regions.map(k=>`<button class="tab" data-k="${k}" aria-pressed="${k===tab}">${k}</button>`).join("")}</div>
    <div class="subtabs" id="subtabs"></div>
    <div class="list" id="list"></div>
    </div>
    <div id="railArea" hidden></div>
    <div class="legend"><span>${ICON.card.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px;margin-right:4px"')}카드 탭</span><span>${ICON.phone.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px;margin-right:4px"')}앱 필요 여부</span><span><i style="background:var(--yes)"></i>편함</span><span><i style="background:var(--part)"></i>조건부</span><span><i style="background:var(--no)"></i>준비 필요</span></div>
    <div id="reqbox"></div>
    <div id="inbox"></div>
    <footer>정보 기준일 2026년 11월 · 출발 전 공식 사이트도 확인하세요<br><a href="privacy.html">개인정보처리방침</a></footer>
  </div>`;
  renderList();renderInbox();renderReq();
  document.getElementById("q").addEventListener("input",e=>{query=e.target.value;renderList()});
  view.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.k;sub="";view.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));renderSub();renderList()}));
  renderSub();renderRailList();
  view.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.m)));
  setMode(mode);
}
function renderSub(){
  const el=document.getElementById("subtabs");if(!el)return;
  if(tab!=="유럽"&&tab!=="아시아"&&tab!=="미주"){el.innerHTML="";return}
  const cs=[...new Set(CITIES.filter(c=>regionOf(c)===tab).map(c=>c.country))];
  el.innerHTML=["",...cs].map(k=>`<button class="chipbtn sub" data-s="${k}" aria-pressed="${k===sub}">${k||"모든 나라"}</button>`).join("");
  el.querySelectorAll(".sub").forEach(b=>b.addEventListener("click",()=>{sub=b.dataset.s;el.querySelectorAll(".sub").forEach(x=>x.setAttribute("aria-pressed",x===b));renderList()}));
}
function renderList(){
  const q=query.trim().toLowerCase();
  const hits=CITIES.filter(c=>(tab==="전체"||(tab==="★ 즐겨찾기"?favs.has(c.id):(regionOf(c)===tab&&(!sub||c.country===sub))))&&(!q||(c.name+c.en+c.country+c.op).toLowerCase().includes(q)));
  const el=document.getElementById("list");if(!el)return;
  el.innerHTML=hits.length?hits.map(c=>`
    <div class="cardwrap">
      <button class="city" data-id="${c.id}" aria-label="${esc(c.name)} 교통 정보">
        <span class="badge" style="background:${c.color}">${c.en[0]}</span>
        <span class="t"><span class="nm">${esc(c.name)}</span><span class="en">${c.en} · ${esc(c.country)}</span></span>
        <span class="ind"><span class="dot ${c.tap.s}" title="카드 탭: ${esc(c.tap.a)}">${ICON.card}</span><span class="dot ${c.app.s}" title="앱: ${esc(c.app.a)}">${ICON.phone}</span></span>
      </button>
      <button class="fav" data-fav="${c.id}" aria-pressed="${favs.has(c.id)}" aria-label="${esc(c.name)} 즐겨찾기">${ICON.star}</button>
    </div>`).join(""):`<p class="empty">${tab==="★ 즐겨찾기"?"별을 눌러 자주 보는 도시를 모아두세요.":"아직 없는 도시예요."}</p>${tab==="★ 즐겨찾기"?"":`<div class="actions" style="justify-content:center"><button class="btn" id="reqFromEmpty">이 도시 추가 요청하기</button></div>`}`;
  const rb=document.getElementById("reqFromEmpty");if(rb)rb.addEventListener("click",()=>{reqOpen=true;reqPrefill=query.trim();renderReq();document.getElementById("reqbox").scrollIntoView({behavior:"smooth"})});
  el.querySelectorAll(".city").forEach(b=>b.addEventListener("click",()=>{location.hash=b.dataset.id}));
  el.querySelectorAll(".fav").forEach(b=>b.addEventListener("click",()=>{toggleFav(b.dataset.fav);renderList()}));
}
function renderReq(){
  const el=document.getElementById("reqbox");if(!el)return;
  if(reqOpen&&document.getElementById("reqCity"))return;
  if(!(db&&myId)){el.innerHTML=`<div class="reqcta"><b>찾는 도시가 없나요?</b><span class="note">추가 요청 기능을 준비하고 있어요.</span></div>`;return}
  if(!reqOpen){
    el.innerHTML=`<div class="reqcta"><div><b>찾는 도시가 없나요?</b><span class="note">가고 싶은 도시나 나라를 알려주시면 조사해서 추가할게요.</span></div><button class="btn" id="reqOpenBtn">추가 요청</button></div>`;
    document.getElementById("reqOpenBtn").addEventListener("click",()=>{reqOpen=true;renderReq()});return}
  el.innerHTML=`<div class="form"><label for="reqCity">추가했으면 하는 도시·나라</label><input id="reqCity" maxlength="60" placeholder="예: 바르셀로나 근교 지로나, 베트남 나트랑" value="${esc(reqPrefill)}">
  <label for="reqNote">하고 싶은 말 (선택)</label><textarea id="reqNote" maxlength="300" placeholder="예: 다음 달에 가는데 버스 타는 법이 궁금해요"></textarea>
  <div class="actions"><button class="btn" id="reqSend">요청 보내기</button><button class="btn ghost" id="reqCancel">취소</button></div><span class="note">요청은 운영자만 봐요.</span></div>`;
  document.getElementById("reqCancel").addEventListener("click",()=>{reqOpen=false;reqPrefill="";renderReq()});
  document.getElementById("reqSend").addEventListener("click",async e=>{
    const city=document.getElementById("reqCity").value.trim();if(!city){toast("도시나 나라 이름을 적어주세요");return}
    e.target.disabled=true;
    try{await appendMine("requests",{city,note:document.getElementById("reqNote").value.trim(),at:Date.now()});reqOpen=false;reqPrefill="";renderReq();toast("요청 고마워요! 조사해서 추가할게요")}
    catch(err){e.target.disabled=false;toast("보내지 못했어요. 잠시 후 다시 시도해 주세요")}
  });
}
function renderInbox(){const el=document.getElementById("inbox");if(el)el.innerHTML=""}

/* 상세 */
function verdict(q,v){return `<div class="tk"><div class="big ${v.s}">${ICON[v.s]}</div><span class="q">${q}</span><span class="a">${esc(v.a)}</span><span class="d">${esc(v.d)}</span></div>`}
function info(lab,o){return `<div class="info"><span class="lab">${lab}</span><div class="row"><span class="n">${esc(o.n)}</span>${o.p?`<span class="price">${esc(o.p)}</span>`:""}</div><span class="d">${esc(o.d)}</span></div>`}
let cur=null,openForm=null;
function cityView(c){
  cur=c;openForm=null;
  view.innerHTML=`
  <div class="hero" style="background:${c.color}"><div class="wrap">
    <button class="back" id="back">← 도시 목록</button>
    <button class="fav" id="hfav" aria-pressed="${favs.has(c.id)}" aria-label="즐겨찾기">${ICON.star}</button>
    ${flagImg(c.country,"flaghero")}<span class="ctry">${esc(c.country)}</span><h2>${esc(c.name)}</h2><span class="en">${c.en}</span><span class="op">${esc(c.op)}</span>
  </div></div>
  <div class="wrap" style="--c:${c.color}">
    <div class="ticket">${verdict("신용카드 바로 탭?",c.tap)}${verdict("앱 깔아야 해?",c.app)}</div>
    ${appSection(c)}
    ${airSection(c)}
    <section class="sec"><h3>도착하면 이렇게</h3><ol class="steps">${c.first.map((s,i)=>`<li data-n="${i+1}"><span>${esc(s)}</span></li>`).join("")}</ol></section>
    <section class="sec"><h3>교통카드와 할인</h3>${info("교통카드",c.card)}${info("할인·정기권",c.student)}</section>
    <section class="sec"><div class="tip"><b>알아두면 좋은 것</b><span>${esc(c.tip)}</span></div></section>
    <section class="sec" id="community"></section>
    <div class="meta"><span>마지막 확인 2026년 11월 · 출처</span>${c.src.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div>
  </div>`;
  document.getElementById("back").addEventListener("click",()=>{location.hash=""});
  const hf=document.getElementById("hfav");
  hf.addEventListener("click",()=>{toggleFav(c.id);hf.setAttribute("aria-pressed",favs.has(c.id))});
  renderCommunity();
  window.scrollTo(0,0);
}
function renderCommunity(){
  const el=document.getElementById("community");if(!el||!cur)return;
  const c=cur;
  const mine=tips.filter(t=>t.city===c.id).sort((a,b)=>b.at-a.at);
  const canWrite=db&&myId;
  let listHtml="";
  if(tipsState==="off")listHtml=`<span class="note">팁 기능을 준비하고 있어요.</span>`;
  else if(tipsState==="loading")listHtml=`<span class="note">팁을 불러오는 중…</span>`;
  else if(tipsState==="slow")listHtml=`<span class="note">팁을 아직 불러오지 못했어요. 연결이 느린 것 같아요.</span>`;
  else if(tipsState==="error")listHtml=`<span class="note">팁을 불러오지 못했어요.</span>`;
  else listHtml=mine.length?`<div class="tips">${mine.map(t=>`<div class="tipitem"><span class="who">${esc(t.role)}${t.owner===myId?" · 내가 쓴 팁":""} · ${new Date(t.at).toLocaleDateString("ko-KR")}</span><p>${esc(t.text)}</p></div>`).join("")}</div>`:`<span class="note">아직 팁이 없어요. ${esc(c.name)}에 살아봤다면 첫 팁을 남겨주세요.</span>`;
  if(!el.dataset.built){
    el.innerHTML=`<div class="sechead"><h3>다녀온 사람들의 팁</h3></div><div id="tipList"></div><div id="tipActions"></div><div id="formArea"></div>`;
    el.dataset.built="1";
  }
  document.getElementById("tipList").innerHTML=listHtml;
  const act=document.getElementById("tipActions");
  if(act.dataset.can!==String(!!canWrite)){
    act.dataset.can=String(!!canWrite);
    act.innerHTML=canWrite?`<div class="actions"><button class="btn" id="openTip">팁 남기기</button><button class="btn ghost" id="openRep">정보가 바뀌었어요</button></div>`:"";
    if(canWrite){
      document.getElementById("openTip").addEventListener("click",()=>{openForm=openForm==="tip"?null:"tip";drawForm()});
      document.getElementById("openRep").addEventListener("click",()=>{openForm=openForm==="rep"?null:"rep";drawForm()});
    }
  }
}
function drawForm(){
  const el=document.getElementById("formArea");if(!el)return;
  const c=cur;
  if(openForm==="tip"){
    let role=ROLES[0];
    el.innerHTML=`<div class="form"><label>나는</label><div class="chips">${ROLES.map(r=>`<button class="chipbtn" data-r="${r}" aria-pressed="${r===role}">${r}</button>`).join("")}</div>
    <label for="tipText">${esc(c.name)}에서 알게 된 교통 팁</label><textarea id="tipText" maxlength="400" placeholder="예: 트램 정류장 발권기는 동전만 받는 곳이 있어요"></textarea>
    <div class="actions"><button class="btn" id="sendTip">팁 올리기</button></div><span class="note">팁은 다른 사용자에게 공개돼요. 개인정보는 적지 마세요.</span></div>`;
    el.querySelectorAll(".chipbtn").forEach(b=>b.addEventListener("click",()=>{role=b.dataset.r;el.querySelectorAll(".chipbtn").forEach(x=>x.setAttribute("aria-pressed",x===b))}));
    el.querySelector("#sendTip").addEventListener("click",async e=>{
      const text=document.getElementById("tipText").value.trim();if(!text){toast("팁 내용을 적어주세요");return}
      e.target.disabled=true;
      try{await appendMine("tips",{city:c.id,role,text,at:Date.now()});openForm=null;drawForm();renderCommunity();toast("팁을 올렸어요")}
      catch(err){e.target.disabled=false;toast(err?.code==="not_granted"||err?.code==="permission_denied"?"이 페이지에서 글을 쓸 권한이 없어요":"올리지 못했어요. 잠시 후 다시 시도해 주세요")}
    });
  }else if(openForm==="rep"){
    el.innerHTML=`<div class="form"><label for="repField">어떤 정보가 바뀌었나요?</label><select id="repField">${FIELDS.map(f=>`<option>${f}</option>`).join("")}</select>
    <label for="repText">지금은 어떻게 되어 있나요?</label><textarea id="repText" maxlength="400" placeholder="예: 11월부터 트램에서도 카드 탭이 돼요"></textarea>
    <div class="actions"><button class="btn" id="sendRep">제보 보내기</button></div><span class="note">제보는 운영자만 보고, 확인한 뒤 정보에 반영해요.</span></div>`;
    el.querySelector("#sendRep").addEventListener("click",async e=>{
      const text=document.getElementById("repText").value.trim();if(!text){toast("바뀐 내용을 적어주세요");return}
      e.target.disabled=true;
      try{await appendMine("reports",{city:c.id,field:document.getElementById("repField").value,text,at:Date.now()});openForm=null;drawForm();toast("제보 고마워요! 확인 후 반영할게요")}
      catch(err){e.target.disabled=false;toast("보내지 못했어요. 잠시 후 다시 시도해 주세요")}
    });
  }else el.innerHTML="";
}
function route(){const h=location.hash.slice(1);
  if(h.startsWith("rail-")){const r=RAIL.find(x=>"rail-"+x.id===h);if(r){mode="rail";railView(r);return}}
  const c=CITIES.find(x=>x.id===h);c?cityView(c):(cur=null,listView())}
window.addEventListener("hashchange",route);
route();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
